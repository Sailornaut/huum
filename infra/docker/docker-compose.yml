# HUUM MVP — Local Development Stack
# Usage: docker compose up -d
# Access: API at localhost:3001, Web at localhost:3000, DB at localhost:5432

services:
  postgres:
    image: postgres:15-alpine
    container_name: huum-postgres
    environment:
      POSTGRES_DB: huum
      POSTGRES_USER: huum_app
      POSTGRES_PASSWORD: huum_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huum_app -d huum"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: huum-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: huum-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/huum-media --ignore-existing;
      mc anonymous set download local/huum-media;
      "

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: huum-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: huum
      DATABASE_USERNAME: huum_app
      DATABASE_PASSWORD: huum_dev_password
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: huum-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Production image (runner stage) — uses compiled dist/main.js
    command: ["node", "dist/main.js"]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: huum-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3030:3000"
    depends_on:
      - api
    # Production image (runner stage) — uses Next.js standalone server
    command: ["node", "server.js"]

volumes:
  postgres_data:
  minio_data:
